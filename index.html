<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#eef4f5;--ink:#20303a;--muted:#71808a;--dark:#162c3d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf4f6,#f8f4ed);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1450px;margin:auto;padding:22px}.top{margin-bottom:15px}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:5px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{border:1px solid #d8e0e3;background:#fff;border-radius:18px;padding:10px 18px;min-width:92px;cursor:pointer}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(390px,.75fr);height:calc(100vh - 155px);min-height:620px;gap:14px}.mapcard,.side{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 35px #19334b14}
#map{height:100%;min-height:620px}.side{padding:24px;overflow:auto}.kicker{font-size:13px;color:#82909a;letter-spacing:2px}.title{font-size:28px;font-weight:750;margin:4px 0}
.desc{color:#64727c;line-height:1.7;margin-bottom:18px}.routepill{background:#eef3f5;padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:18px;line-height:1.7}
.item{display:grid;grid-template-columns:45px 1fr;gap:12px;position:relative;padding-bottom:19px}.item:not(:last-child):before{content:"";position:absolute;left:16px;top:34px;width:2px;height:calc(100% - 13px);background:#cbd6dc}.num{width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;z-index:2}.time{font-size:13px;color:#77858f}.name{font-size:17px;font-weight:700;line-height:1.35}.act{margin-top:6px;color:#596770;font-size:13px;line-height:1.5}.note{background:#f3f6f6;border-radius:14px;padding:14px;margin-top:5px;color:#65737c;font-size:12px;line-height:1.6}
.pin{width:32px;height:32px;border-radius:50%;background:var(--dark);color:white;border:3px solid white;box-shadow:0 2px 7px #0005;display:flex;align-items:center;justify-content:center;font-weight:800}
@media(max-width:900px){.grid{grid-template-columns:1fr;height:auto}#map{height:55vh;min-height:430px}.side{min-height:520px}}
</style></head><body>
<div class="wrap"><div class="top"><h1>日本東北仙台・山形賞雪行</h1><div class="sub">2027/1/28 – 2027/2/3　｜　每日移動路線</div></div>

<div class="desc">地圖用簡化示意呈現，只畫「點 → 點」的移動脈絡，不處理精確道路、鐵路或公車路線。</div>
<div class="routepill">📍 <span id="routeText"></span></div><div id="timeline"></div>
<div class="note">🗺️ 地圖為旅行規劃示意；實際導航與交通方式請以 Google Maps 等即時資訊為準。</div>
</aside></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

]},

]},

  {"date": "2027-02-01", "nodes": [{"label": "仙台JR站", "time": "08:00", "lat": 38.2601, "lon":  140.8824, "acts": [["08:00", "（仙台出發）藏王中央纜車＆狐狸村一日遊"]]}, {"label": "藏王纜車（藏王樹冰）","time": "10:00","lat": 38.16,"lon": 140.397,"acts": [["10:00", "抵達藏王纜車看樹冰囉"]]},{"label": "藏王狐狸村","time": "14:00","lat":38.008,"lon": 140.535,"acts": [["14:00","藏王狐狸村"]]},{"label": "仙台車站", "time": "18:00", "lat": 38.2601, "lon": 140.8824, "acts": [["18:00", "仙台車站"]]}
]},

  {"date": "2027-02-03", "nodes": [{"label": "前往關西機場", "time": "5:05", "lat": 34.4089, "lon": 135.3, "acts": [["5:05", "退房去機場"]]},{"label": "關西國際機場", "time": "07:15", "lat": 34.4347, "lon": 135.244, "acts": [["07:15", "日本 關西 → 台灣 桃園"]]}, {"label": "桃園機場第一航廈", "time": "10:15", "lat": 25.0797, "lon": 121.2342, "acts": [["10:15", "桃園 → 員林"]]},{"label": "回家", "time": "", "lat":23.95, "lon": 120.34, "acts": [["", "回到員林"]]}

const map=L.map('map',{zoomControl:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let layer=L.layerGroup().addTo(map);
const tabs=document.getElementById('tabs');
days.forEach((d,i)=>{const b=document.createElement('button');b.className='tab';b.textContent='Day '+(i+1)+'  ·  '+d.date.slice(5).replace('-','/');b.onclick=()=>render(i);tabs.appendChild(b);});
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function pinIcon(n){return L.divIcon({className:'',html:'<div class="pin">'+n+'</div>',iconSize:[32,32],iconAnchor:[16,16]});}
function render(i){
 const d=days[i];layer.clearLayers();document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('active',j===i));
 document.getElementById('kicker').textContent='DAY '+(i+1);document.getElementById('title').textContent=d.date;
 document.getElementById('routeText').textContent=d.nodes.map(n=>n.label).join('  →  ');
 const tl=document.getElementById('timeline');tl.innerHTML='';const pts=[];
 d.nodes.forEach((n,j)=>{
   pts.push([n.lat,n.lon]);const marker=L.marker([n.lat,n.lon],{icon:pinIcon(j+1)}).addTo(layer);
   marker.bindPopup('<b>'+(j+1)+'. '+esc(n.label)+'</b>'+(n.time?' · '+esc(n.time):''));
   const el=document.createElement('div');el.className='item';
   const acts=n.acts.filter(a=>a[1]&&a[1]!=='nan');
   el.innerHTML='<div class="num">'+(j+1)+'</div><div><div class="time">'+esc(n.time)+'</div><div class="name">'+esc(n.label)+'</div>'+
     (acts.length?'<div class="act">'+acts.map(a=>esc((a[0]?a[0]+' ':'')+a[1])).join('<br>')+'</div>':'')+'</div>';
   tl.appendChild(el);
 });
 if(pts.length>1)L.polyline(pts,{color:'#315a73',weight:4,opacity:.8,dashArray:'9 7'}).addTo(layer);
 if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[50,50],maxZoom:9});
}
render(0);
